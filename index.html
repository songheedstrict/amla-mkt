<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AMLA 마케팅/PR 일정</title>
<style>
/* ───────── Pretendard (자체 정의, 공개 CDN) ───────── */
@font-face{font-family:"Pretendard";font-weight:400;font-style:normal;font-display:swap;
  src:url("https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/packages/pretendard/dist/web/static/woff2/Pretendard-Regular.woff2") format("woff2");}
@font-face{font-family:"Pretendard";font-weight:600;font-style:normal;font-display:swap;
  src:url("https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/packages/pretendard/dist/web/static/woff2/Pretendard-SemiBold.woff2") format("woff2");}
@font-face{font-family:"Pretendard";font-weight:700;font-style:normal;font-display:swap;
  src:url("https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/packages/pretendard/dist/web/static/woff2/Pretendard-Bold.woff2") format("woff2");}

/* ───────── 색상 토큰 ───────── */
:root{
  color-scheme: light dark;
  --bg:#F5F6F8; --surface:#FFFFFF; --surface-2:#F0F2F5; --surface-3:#E7EAEE;
  --text:#14171C; --text-2:#4A5361; --line:#E1E5EA; --line-strong:#C3CBD5;
  --accent:#2B55D9; --accent-ink:#FFFFFF; --accent-soft:#E7EDFD;
  --today:#D93A40; --today-ink:#B8262C; --today-soft:#FCEAEA;
  --now-col:#FFF7DD; --now-ink:#7A5200; --weekend:#B8262C;
  --backdrop:rgba(10,14,20,.45); --shadow:0 10px 30px rgba(16,24,40,.16);
  --error-bg:#FDECEC; --error-ink:#9B1C1F;

  /* 카테고리: bg(연한 톤) / fg(진한 톤, 텍스트·테두리) */
  --c1-bg:#EDF0F4; --c1-fg:#35455A;   /* 자료 수취 */
  --c2-bg:#E6EFFF; --c2-fg:#1D48C4;   /* 온라인광고 */
  --c3-bg:#FFEDE3; --c3-fg:#A83C0C;   /* Fever 페이지 */
  --c4-bg:#E1F5F1; --c4-fg:#0B6457;   /* 웹사이트 */
  --c5-bg:#FCE7F2; --c5-fg:#A01858;   /* SNS */
  --c6-bg:#EFE9FE; --c6-fg:#5630BF;   /* PR */
  --c7-bg:#FFF3D4; --c7-fg:#7D5100;   /* OOH */
  --c8-bg:#E6F4E2; --c8-fg:#2B641C;   /* 인플루언서 */
  --c9-bg:#FDE7E6; --c9-fg:#AE2117;   /* 오픈 이벤트 */
  --x1-bg:#E1F2F9; --x1-fg:#0A5C78;   /* 자동 배정용 */
  --x2-bg:#F3ECE5; --x2-fg:#6E4424;
  --x3-bg:#E8EAFD; --x3-fg:#3730A3;
  --x4-bg:#EFF2DC; --x4-fg:#525A0C;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0F1216; --surface:#171B21; --surface-2:#1E232A; --surface-3:#272D35;
    --text:#ECEFF3; --text-2:#A9B3C1; --line:#2A3038; --line-strong:#3C4450;
    --accent:#7FA2FF; --accent-ink:#0F1216; --accent-soft:#1E2A4A;
    --today:#FF6B6F; --today-ink:#FF8F92; --today-soft:#3A1C1E;
    --now-col:#2A2412; --now-ink:#F2CD72; --weekend:#FF8F92;
    --backdrop:rgba(0,0,0,.6); --shadow:0 10px 30px rgba(0,0,0,.5);
    --error-bg:#3A1C1E; --error-ink:#FFB3B5;

    --c1-bg:#242E3B; --c1-fg:#C9D4E3;
    --c2-bg:#172748; --c2-fg:#A3C3FF;
    --c3-bg:#3A2317; --c3-fg:#FFB891;
    --c4-bg:#0F2F2A; --c4-fg:#80DCCB;
    --c5-bg:#3A172A; --c5-fg:#F7A8D0;
    --c6-bg:#282046; --c6-fg:#C8B8FF;
    --c7-bg:#382C0E; --c7-fg:#F4D07A;
    --c8-bg:#1C3118; --c8-fg:#A8DC96;
    --c9-bg:#3D1A19; --c9-fg:#FFABA3;
    --x1-bg:#0F2C38; --x1-fg:#8ED4F0;
    --x2-bg:#34271D; --x2-fg:#E7C2A2;
    --x3-bg:#23244A; --x3-fg:#B9BCFF;
    --x4-bg:#2B2F12; --x4-fg:#D6DE8C;
  }
}

/* ───────── 기본 ───────── */
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{
  margin:0;background:var(--bg);color:var(--text);
  font-family:"Pretendard",-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;
  font-size:15px;line-height:1.5;overflow-x:hidden;
  word-break:keep-all;overflow-wrap:anywhere;
}
button{font:inherit;color:inherit}
a{color:var(--accent)}
.wrap{
  max-width:1680px;margin:0 auto;
  padding:16px calc(16px + env(safe-area-inset-right)) calc(32px + env(safe-area-inset-bottom)) calc(16px + env(safe-area-inset-left));
}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px}
.muted{color:var(--text-2)}
.clamp3{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.btn{
  min-height:44px;min-width:44px;padding:0 14px;border-radius:12px;border:1px solid var(--line-strong);
  background:var(--surface);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;
  font-size:14px;font-weight:600;
}
.btn:hover{background:var(--surface-2)}
.btn:focus-visible,.chip:focus-visible,.card:focus-visible,.tab:focus-visible,.cal-cell:focus-visible,.pill:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn.icon{padding:0;width:44px}
.btn[disabled]{opacity:.4;cursor:default}
.spin{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* ───────── 헤더 ───────── */
.hdr{display:flex;flex-wrap:wrap;align-items:flex-start;justify-content:space-between;gap:12px 16px;margin-bottom:12px}
.hdr h1{margin:0;font-size:24px;line-height:1.3;font-weight:700;letter-spacing:-.01em}
.hdr .meta{display:flex;flex-wrap:wrap;gap:4px 12px;margin-top:4px;font-size:14px;color:var(--text-2)}
.hdr .meta b{color:var(--text);font-weight:600}
.sync{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--text-2)}
.dday{
  display:inline-flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:8px;
  background:var(--accent-soft);color:var(--text);border-radius:999px;padding:6px 12px;font-size:14px
}
.dday strong{color:var(--accent);font-weight:700}
.banner{display:none;margin:0 0 12px;padding:12px 14px;border-radius:12px;background:var(--error-bg);color:var(--error-ink);font-size:14px}
.banner.show{display:block}
.banner a{color:inherit;font-weight:600}

/* ───────── 마일스톤 타임라인 ───────── */
.tl{margin-bottom:12px;padding:12px 0 8px}
.tl-head{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:0 16px 4px;font-size:14px;font-weight:600}
.tl-scroll{overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch;scroll-snap-type:x mandatory;overscroll-behavior-x:contain;scrollbar-width:thin}
.tl-track{position:relative;width:100%;padding:0 16px}
.tl-lanes{position:relative}
.tl-bar{position:relative;display:flex;height:40px}
.tl-month{flex:1 1 0;position:relative;scroll-snap-align:start;border-left:1px solid var(--line-strong)}
.tl-month:last-child{border-right:1px solid var(--line-strong)}
.tl-month::after{content:"";position:absolute;left:0;right:0;top:25px;height:8px;background:var(--surface-3)}
.tl-month span{position:absolute;left:6px;top:0;z-index:3;line-height:18px;font-size:13px;font-weight:700;color:var(--text-2);background:var(--surface);padding:0 4px;border-radius:4px}
.tl-pin{position:absolute;top:29px;width:14px;height:14px;margin:-7px 0 0 -7px;border-radius:50%;background:var(--accent);border:2px solid var(--surface);z-index:2}
.tl-pin.tent{background:var(--surface);border:2px dashed var(--accent)}
.tl-stem{position:absolute;width:0;border-left:1px solid var(--line-strong);z-index:1}
.tl-label{
  position:absolute;white-space:nowrap;font-size:13px;line-height:1.3;padding:4px 8px;border-radius:8px;
  background:var(--accent-soft);color:var(--text);border:1px solid transparent;cursor:pointer;min-height:0;text-align:left
}
.tl-label b{font-weight:700}
.tl-label .d{color:var(--text-2);margin-left:4px}
.tl-label.tent{border:1px dashed var(--accent);background:var(--surface)}
.tl-label.past{opacity:.6}
.tl-today{position:absolute;top:18px;height:22px;width:0;margin-left:-1px;border-left:2px solid var(--today);z-index:3;pointer-events:none}
.tl-label.today{cursor:default;background:var(--today-soft);color:var(--today-ink);font-weight:700}
.tl-stem.today{border-left:2px solid var(--today);margin-left:-1px}
.tl-note{padding:4px 16px 0;font-size:13px;color:var(--text-2)}

/* ───────── 필터 ───────── */
.filters{margin-bottom:12px;padding:12px 16px}
.f-toggle{display:none}
.f-body{display:grid;gap:10px}
.f-row{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px}
.f-label{font-size:13px;font-weight:700;color:var(--text-2);min-width:64px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{
  min-height:44px;padding:0 14px;border-radius:999px;border:1px solid var(--line-strong);background:var(--surface);
  cursor:pointer;display:inline-flex;align-items:center;gap:6px;font-size:14px;font-weight:600;
}
.chip .dot{width:10px;height:10px;border-radius:50%;flex:none}
.chip[aria-pressed="true"]{background:var(--text);color:var(--surface);border-color:var(--text)}
.chip.clear{border-style:dashed;color:var(--text-2)}
.switch{display:inline-flex;align-items:center;gap:10px;min-height:44px;cursor:pointer;font-size:14px;font-weight:600}
.switch input{position:absolute;opacity:0;pointer-events:none}
.switch .trk{width:44px;height:26px;border-radius:999px;background:var(--line-strong);position:relative;transition:background .15s;flex:none}
.switch .trk::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:transform .15s}
.switch input:checked + .trk{background:var(--accent)}
.switch input:checked + .trk::after{transform:translateX(18px)}
.switch input:focus-visible + .trk{outline:2px solid var(--accent);outline-offset:2px}

/* ───────── 탭 ───────── */
.tabs{display:flex;gap:4px;padding:4px;background:var(--surface-2);border-radius:14px;margin-bottom:12px;width:max-content;max-width:100%}
.tab{min-height:44px;padding:0 16px;border:0;border-radius:10px;background:transparent;cursor:pointer;font-size:14px;font-weight:600;color:var(--text-2);flex:1 1 auto}
.tab[aria-selected="true"]{background:var(--surface);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.view{display:none}
.view.active{display:block}
.empty{padding:24px;text-align:center;color:var(--text-2);font-size:14px}

/* ───────── 공통 카드 / 뱃지 ───────── */
.card{
  display:block;width:100%;text-align:left;cursor:pointer;
  background:var(--cbg);color:var(--text);border:1px solid transparent;border-left:4px solid var(--cfg);
  border-radius:8px;padding:6px 8px;font-size:14px;line-height:1.4
}
.card:hover{filter:brightness(.97)}
.card.tent{background:var(--surface);border:1px dashed var(--cfg);border-left:4px dashed var(--cfg)}
.card .top{display:flex;flex-wrap:wrap;align-items:center;gap:4px;margin-bottom:2px}
.date-b{display:inline-block;font-size:13px;font-weight:700;color:var(--cfg)}
.tent-b{display:inline-block;font-size:13px;font-weight:700;line-height:1.3;padding:0 6px;border-radius:6px;border:1px dashed currentColor;color:var(--text-2);white-space:nowrap}
.card .txt{font-weight:600;font-size:14px}
.card .own{font-size:13px;color:var(--text-2);margin-top:2px}
.card .cat{display:none;align-items:center;gap:6px;font-size:13px;font-weight:700;color:var(--cfg);margin-bottom:4px}
.card .cat::before{content:"";width:16px;height:4px;border-radius:2px;background:var(--cfg);flex:none}
.cat-tag{display:inline-flex;align-items:center;font-size:13px;font-weight:700;color:var(--cfg);background:var(--cbg);padding:1px 8px;border-radius:6px;white-space:nowrap}
.ms-flag{display:inline-flex;align-items:center;gap:4px;font-size:13px;font-weight:700;color:var(--accent);background:var(--accent-soft);border-radius:6px;padding:1px 6px;border:1px solid transparent;cursor:pointer;text-align:left;line-height:1.35}
.ms-flag.tent{background:transparent;border:1px dashed var(--accent)}

/* ───────── 주간 보기 ───────── */
.wk-nav{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}
.wk-nav .lbl{font-size:15px;font-weight:700;text-align:center;flex:1}
.wk-nav .lbl small{display:block;font-size:13px;font-weight:400;color:var(--text-2)}
.wk-box{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.wk-scroll{overflow-x:auto;overflow-y:hidden;transition:height .2s;-webkit-overflow-scrolling:touch;scroll-snap-type:x mandatory;overscroll-behavior-x:contain;scroll-padding-left:var(--lab,0px)}
.wk-grid{display:grid;grid-template-columns:var(--lab) repeat(var(--weeks),var(--wcol));min-width:0}
.wk-grid > div{border-bottom:1px solid var(--line);border-right:1px solid var(--line);padding:6px;min-width:0}
.wk-corner,.wk-lab{position:sticky;left:0;z-index:2;background:var(--surface)}
.wk-corner{font-size:13px;font-weight:700;color:var(--text-2);display:flex;align-items:flex-end}
.wk-lab{display:flex;gap:8px;align-items:flex-start;font-size:14px;font-weight:700}
.wk-lab::before{content:"";width:4px;align-self:stretch;border-radius:2px;background:var(--cfg);flex:none}
.wk-head{scroll-snap-align:start;background:var(--surface-2)}
.wk-head .w{font-size:14px;font-weight:700}
.wk-head .r{font-size:13px;color:var(--text-2)}
.wk-head .flags{display:flex;flex-direction:column;align-items:flex-start;gap:4px;margin-top:4px}
.wk-head.now{background:var(--now-col)}
.now-b{display:inline-block;font-size:13px;font-weight:700;color:var(--now-ink)}
.wk-cell{display:flex;flex-direction:column;gap:6px}
.wk-cell.now{background:var(--now-col)}
/* 모바일 주간 패널 */
.wk-panels{display:flex;align-items:flex-start}
.wk-panel{flex:0 0 100%;min-width:0;scroll-snap-align:start;scroll-snap-stop:always;padding:12px}
.wk-panel.now{background:var(--now-col)}
.wk-panel .ph{margin-bottom:10px}
.wk-panel .ph .w{font-size:15px;font-weight:700}
.wk-panel .ph .r{font-size:13px;color:var(--text-2)}
.wk-panel .flags{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.wk-panel .list{display:flex;flex-direction:column;gap:8px}
.wk-panel .card{padding:10px 12px}
.wk-panel .card .cat{display:flex}
.dots{display:flex;justify-content:center;flex-wrap:wrap;gap:6px;padding:10px 0 2px}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--line-strong)}
.dots i.now{background:var(--now-ink)}
.dots i.on{background:var(--accent);width:18px;border-radius:4px}

/* ───────── 월간 캘린더 ───────── */
.cal-month{margin-bottom:16px;padding:12px}
.cal-month h3{margin:4px 4px 10px;font-size:17px;font-weight:700}
.cal-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border-top:1px solid var(--line);border-left:1px solid var(--line)}
.cal-dow{font-size:13px;font-weight:700;color:var(--text-2);text-align:center;padding:6px 0;border-right:1px solid var(--line);border-bottom:1px solid var(--line);background:var(--surface-2)}
.cal-dow.we{color:var(--weekend)}
.cal-cell{min-height:104px;padding:4px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:4px;min-width:0;background:var(--surface);text-align:left}
.cal-cell.out{background:var(--surface-2)}
.cal-cell.today{box-shadow:inset 0 0 0 2px var(--today)}
.cal-cell .dn{font-size:13px;font-weight:700;color:var(--text-2)}
.cal-cell .dn.we{color:var(--weekend)}
.cal-cell.today .dn{color:var(--today-ink)}
.pill{display:block;width:100%;text-align:left;cursor:pointer;font-size:13px;line-height:1.35;font-weight:600;padding:2px 6px;border-radius:6px;background:var(--cbg);color:var(--cfg);border:1px solid transparent}
.pill.tent{background:transparent;border:1px dashed var(--cfg)}
.cal-legend{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 12px}

/* ───────── 리스트(아젠다) ───────── */
.ag-tools{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.ag-group{margin-bottom:12px;padding:0;overflow:hidden}
.ag-gh{display:flex;justify-content:space-between;align-items:baseline;gap:8px;padding:10px 16px;background:var(--surface-2);font-size:15px;font-weight:700}
.ag-gh .r{font-size:13px;font-weight:400;color:var(--text-2)}
.ag-group.now .ag-gh{background:var(--now-col)}
.ag-item{display:grid;grid-template-columns:64px minmax(0,1fr);gap:12px;padding:12px 16px;border-top:1px solid var(--line);cursor:pointer;background:transparent;border-left:0;border-right:0;border-bottom:0;width:100%;text-align:left}
.ag-item:hover{background:var(--surface-2)}
.ag-date{font-size:15px;font-weight:700;line-height:1.3}
.ag-date small{display:block;font-size:13px;font-weight:600;color:var(--text-2)}
.ag-date.we small{color:var(--weekend)}
.ag-date.today{color:var(--today-ink)}
.ag-body .tags{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:4px}
.ag-body .txt{font-size:15px;font-weight:600}
.ag-body .own{font-size:13px;color:var(--text-2);margin-top:2px}
.ag-item.tent .txt{color:var(--text-2)}
.ag-item.ms{background:var(--accent-soft)}
.past-toggle{width:100%;margin-bottom:12px;justify-content:space-between}

/* ───────── 상세 팝오버 / 바텀시트 ───────── */
.scrim{position:fixed;inset:0;background:var(--backdrop);z-index:50;opacity:0;pointer-events:none;transition:opacity .15s}
.scrim.show{opacity:1;pointer-events:auto}
.pop{
  position:fixed;z-index:51;background:var(--surface);color:var(--text);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);
  width:min(360px,calc(100vw - 32px));max-height:min(70vh,560px);overflow:auto;padding:16px;display:none
}
.pop.show{display:block}
.pop .x{float:right;margin:-8px -8px 0 8px;border:0;background:transparent;font-size:22px;line-height:1}
.pop h4{margin:0 0 10px;font-size:17px;line-height:1.4;font-weight:700}
.pop dl{margin:0;display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px 12px;font-size:15px}
.pop dt{color:var(--text-2);font-weight:600;font-size:14px}
.pop dd{margin:0}
.pop .full{white-space:pre-wrap}
.pop .items{display:flex;flex-direction:column;gap:8px}
.pop .grab{display:none}
@media (max-width:600px){
  .pop{left:0 !important;right:0;top:auto !important;bottom:0;width:100%;max-width:100%;max-height:82vh;border-radius:18px 18px 0 0;
       padding:8px 16px calc(20px + env(safe-area-inset-bottom));transform:translateY(100%);transition:transform .2s ease;display:block;visibility:hidden}
  .pop.show{transform:none;visibility:visible}
  .pop .grab{display:block;width:40px;height:5px;border-radius:3px;background:var(--line-strong);margin:4px auto 12px}
}

/* ───────── 상태 ───────── */
.loading{padding:40px 16px;text-align:center;color:var(--text-2)}
.err-box{padding:20px;border-radius:14px;background:var(--error-bg);color:var(--error-ink)}
.err-box h2{margin:0 0 6px;font-size:17px}
.err-box p{margin:4px 0;font-size:14px}

/* ───────── 반응형 ───────── */
@media (max-width:600px){
  .hdr h1{font-size:21px}
  .filters{padding:8px 12px}
  .f-toggle{display:flex;width:100%;justify-content:space-between}
  .f-body{display:none;margin-top:8px}
  .filters.open .f-body{display:grid}
  .f-label{width:100%}
  .tabs{width:100%}
  .cal-month{padding:8px}
  .cal-cell{min-height:64px;padding:3px;cursor:pointer;border-top:0;border-left:0}

<script>
(function(){
'use strict';

/* ───────── 설정 ───────── */
var SHEET_ID = '10Weg7_ZJBTUlsefyPoBajsVawX9M1Uka-lscx4bh7SQ';
var GID = '0';
/* 기본: 일반 CSV 내보내기(시트 그대로). 예비: gviz CSV(글자가 적은 날짜 열의 내용을 빠뜨릴 수 있음) */
var CSV_URL = 'https://docs.google.com/spreadsheets/d/' + SHEET_ID + '/export?format=csv&gid=' + GID;
var CSV_URL_FALLBACK = 'https://docs.google.com/spreadsheets/d/' + SHEET_ID + '/gviz/tq?tqx=out:csv&gid=' + GID;
var SHEET_LINK = 'https://docs.google.com/spreadsheets/d/' + SHEET_ID + '/edit#gid=' + GID;
var REFRESH_MS = 5 * 60 * 1000;
var DEFAULT_YEAR = 2026;
var DOW = ['일','월','화','수','목','금','토'];

/* 카테고리 고정 색 (공백 제거·소문자 기준) */
var FIXED = {'자료수취':'c1','온라인광고':'c2','fever페이지':'c3','웹사이트':'c4','sns':'c5','pr':'c6','ooh':'c7','인플루언서':'c8','오픈이벤트':'c9'};
var EXTRA = ['x1','x2','x3','x4'];

/* ───────── 상태 ───────── */
var _lastSync = 0;
var S = {
  model:null, view:'week', owners:{}, cats:{}, tent:true,
  collapsePast:true, pastOpen:false, weekIdx:null, firstRender:true, mobile:null, filtersOpen:false, loading:false
};

var $ = function(s, el){ return (el||document).querySelector(s); };
function esc(s){ return String(s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function pad(n){ return (n<10?'0':'')+n; }
function key(d){ return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
function md(d){ return (d.getMonth()+1)+'/'+d.getDate(); }
function mdw(d){ return md(d)+' ('+DOW[d.getDay()]+')'; }
function full(d){ return d.getFullYear()+'.'+pad(d.getMonth()+1)+'.'+pad(d.getDate())+' ('+DOW[d.getDay()]+')'; }
function addDays(d,n){ var x=new Date(d); x.setDate(x.getDate()+n); return x; }
function startOfDay(d){ return new Date(d.getFullYear(), d.getMonth(), d.getDate()); }
function monday(d){ var x=startOfDay(d); var w=(x.getDay()+6)%7; return addDays(x,-w); }
function dayDiff(a,b){ return Math.round((startOfDay(b)-startOfDay(a))/864e5); }
function isWeekend(d){ return d.getDay()===0 || d.getDay()===6; }
function todayD(){ return startOfDay(new Date()); }
function isMobile(){ return window.matchMedia('(max-width:600px)').matches; }
function catVars(cat){ var c = S.model.colors[cat]; return '--cbg:var(--'+c+'-bg);--cfg:var(--'+c+'-fg)'; }

/* ───────── CSV 파서 (따옴표·줄바꿈 대응) ───────── */
function parseCSV(text){
  var rows=[], row=[], f='', q=false, i=0, c;
  text = text.replace(/^﻿/, '');
  for(; i<text.length; i++){
    c = text[i];
    if(q){
      if(c==='"'){ if(text[i+1]==='"'){ f+='"'; i++; } else q=false; }
      else f+=c;
    } else {
      if(c==='"') q=true;
      else if(c===','){ row.push(f); f=''; }
      else if(c==='\n'){ row.push(f); rows.push(row); row=[]; f=''; }
      else if(c==='\r'){ /* skip */ }
      else f+=c;
    }
  }
  if(f!=='' || row.length){ row.push(f); rows.push(row); }
  return rows;
}

/* ───────── 데이터 불러오기 (Apps Script 우선, 아니면 gviz CSV) ───────── */
function inAppsScript(){ return !!(window.google && google.script && google.script.run); }
function loadViaAppsScript(){
  return new Promise(function(res, rej){
    try{
      var runner = google.script.run.withSuccessHandler(res).withFailureHandler(function(e){ rej(new Error(e && e.message || String(e))); });
      if(typeof runner.getSheetData !== 'function') throw new Error('Code.gs에 getSheetData 함수가 없습니다');
      runner.getSheetData();
    }catch(e){ rej(e); }
  });
}
function loadRows(){
  if(inAppsScript()){
    /* Apps Script 우선, 실패하면 공개 CSV로 한 번 더 시도 */
    return loadViaAppsScript().catch(function(e1){
      console.warn('Apps Script 읽기 실패, CSV로 재시도:', e1);
      return loadViaCSV().catch(function(e2){
        var err = new Error(e1.message + ' / CSV: ' + e2.message);
        err.appsScript = true;
        throw err;
      });
    });
  }
  return loadViaCSV();
}
function fetchCSVFrom(url){
  return fetch(url + '&_=' + Date.now(), {cache:'no-store'}).then(function(r){
    if(!r.ok) throw new Error('HTTP '+r.status);
    return r.text();
  }).then(function(t){
    if(/^\s*</.test(t)) throw new Error('시트가 공개되어 있지 않습니다 (공유: 링크가 있는 모든 사용자 – 뷰어 필요)');
    return parseCSV(t);
  });
}
function loadViaCSV(){
  return fetchCSVFrom(CSV_URL).catch(function(e1){
    console.warn('CSV 내보내기 실패, gviz로 재시도:', e1);
    return fetchCSVFrom(CSV_URL_FALLBACK);
  });
}

/* ───────── 시트 해석 (헤더 텍스트 기준) ───────── */
function buildModel(raw){
  var rows = raw.map(function(r){ return (r||[]).map(function(c){ return (c==null?'':String(c)).replace(/\r/g,'').trim(); }); });
  var width = rows.reduce(function(m,r){ return Math.max(m, r.length); }, 0);
  var monthRe = /(?:(\d{4})\s*년\s*)?(\d{1,2})\s*월/;
  var i, j;

  var hRow=-1, taskCol=0, ownerCol=1;
  for(i=0;i<rows.length;i++){
    j = rows[i].indexOf('업무');
    if(j>=0){ hRow=i; taskCol=j; var o=rows[i].indexOf('담당'); ownerCol = o>=0?o:j+1; break; }
  }
  if(hRow<0) throw new Error('"업무" 헤더 행을 찾지 못했습니다.');
  var firstDataCol = Math.max(taskCol, ownerCol) + 1;

  var mRow=-1;
  for(i=0;i<hRow;i++){
    for(j=firstDataCol;j<rows[i].length;j++){ if(/^\s*(?:\d{4}\s*년\s*)?\d{1,2}\s*월\s*$/.test(rows[i][j])){ mRow=i; break; } }
    if(mRow>=0) break;
  }
  if(mRow<0) throw new Error('월 헤더(예: "10월") 행을 찾지 못했습니다.');

  var dRow=-1;
  for(i=0;i<=hRow;i++){
    if(i===mRow) continue;
    var cnt=0; for(j=firstDataCol;j<rows[i].length;j++){ if(/^\d{1,2}$/.test(rows[i][j])) cnt++; }
    if(cnt>=5){ dRow=i; break; }
  }
  if(dRow<0) throw new Error('일자(1~31) 행을 찾지 못했습니다.');

  var title='';
  for(i=0;i<mRow+1 && !title;i++){ for(j=0;j<rows[i].length;j++){ var t=rows[i][j]; if(t && !monthRe.test(t) && !/^\d+$/.test(t)){ title=t; break; } } }
  var ym = (title.match(/(20\d{2})/)||[])[1];
  var year = ym ? +ym : DEFAULT_YEAR;

  /* 월 헤더가 일부 빠져 와도(구글 CSV 변환 시 발생) 일자가 31→1처럼 줄어들면 다음 달로 넘어간다 */
  var cols=[], curM=null, prevM=null, prevDay=null;
  for(j=0;j<width;j++){
    var mc = (rows[mRow][j]||'').match(/^\s*(?:(\d{4})\s*년\s*)?(\d{1,2})\s*월\s*$/);
    if(mc){ var m=+mc[2]; if(mc[1]) year=+mc[1]; else if(prevM!=null && m<prevM) year++; prevM=m; curM=m; }
    if(j<firstDataCol) continue;
    var dc=(rows[dRow][j]||'');
    if(!/^\d{1,2}$/.test(dc)) continue;
    var dnum=+dc;
    if(!mc && curM && prevDay!=null && dnum<prevDay){ curM++; if(curM>12){ curM=1; year++; } prevM=curM; }
    prevDay=dnum;
    if(!curM) continue;
    var dt=new Date(year, curM-1, dnum);
    if(dt.getMonth()===curM-1) cols.push({c:j, date:dt});
  }
  if(!cols.length) throw new Error('날짜 열을 해석하지 못했습니다.');

  /* 마일스톤: A열이 "Milestone/마일스톤"인 행이 있으면 그 행, 없으면 "업무" 행의 날짜 칸 */
  var msRow=-1;
  for(i=0;i<rows.length;i++){ if(i!==hRow && /^(milestones?|마일스톤)$/i.test(rows[i][taskCol]||'')){ msRow=i; break; } }
  var msSrc = msRow>=0 ? msRow : hRow;
  var milestones=[];
  cols.forEach(function(col){
    var t=rows[msSrc][col.c]; if(t) milestones.push({text:t, date:col.date, tent:/\(가\)/.test(t)});
  });

  var events=[], cats=[], owners=[], lastCat='', seenCat={}, seenOwner={}, id=0;
  for(i=hRow+1;i<rows.length;i++){
    if(i===msRow) continue;
    var r=rows[i];
    if(r[taskCol]) lastCat=r[taskCol];
    var cat = r[taskCol] || lastCat || '기타';
    var owner = r[ownerCol] || '';
    var ownerList = owner ? owner.split(/[,，、\/]/).map(function(s){ return s.trim(); }).filter(Boolean) : [];
    cols.forEach(function(col){
      var t=r[col.c]; if(!t) return;
      events.push({id:++id, cat:cat, owner:owner, owners:ownerList, text:t, date:col.date, tent:/\(가\)/.test(t)});
      if(!seenCat[cat]){ seenCat[cat]=1; cats.push(cat); }
      ownerList.forEach(function(o){ if(!seenOwner[o]){ seenOwner[o]=1; owners.push(o); } });
    });
    if(r[taskCol] && !seenCat[r[taskCol]]){ seenCat[r[taskCol]]=1; cats.push(r[taskCol]); }
  }
  events.sort(function(a,b){ return a.date-b.date || cats.indexOf(a.cat)-cats.indexOf(b.cat); });

  var colors={}, x=0;
  cats.forEach(function(c){ var k=c.replace(/\s+/g,'').toLowerCase(); colors[c]=FIXED[k] || EXTRA[(x++)%EXTRA.length]; });

  var start=cols[0].date, end=cols[cols.length-1].date;
  var months=[]; cols.forEach(function(col){ var d=col.date; var mk=d.getFullYear()+'-'+d.getMonth(); if(!months.length || months[months.length-1].k!==mk) months.push({k:mk, y:d.getFullYear(), m:d.getMonth(), days:new Date(d.getFullYear(), d.getMonth()+1, 0).getDate()}); });

  var weeks=[]; for(var ws=monday(start); ws<=end; ws=addDays(ws,7)){
    var thu=addDays(ws,3);
    weeks.push({idx:weeks.length, start:ws, end:addDays(ws,6), label:(thu.getMonth()+1)+'월 '+Math.ceil(thu.getDate()/7)+'주차'});
  }

  return {title:title||'AMLA Marketing/PR', start:start, end:end, months:months, weeks:weeks, cats:cats, owners:owners, colors:colors, events:events, milestones:milestones};
}

/* ───────── 필터 ───────── */
function anyKey(o){ for(var k in o) if(o[k]) return true; return false; }
function pass(ev){
  if(!S.tent && ev.tent) return false;
  if(anyKey(S.cats) && !S.cats[ev.cat]) return false;
  if(anyKey(S.owners) && !ev.owners.some(function(o){ return S.owners[o]; })) return false;
  return true;
}
function filtered(){ return S.model.events.filter(pass); }
function weekIndexOf(d){ var W=S.model.weeks; for(var i=0;i<W.length;i++){ if(d>=W[i].start && d<=W[i].end) return i; } return -1; }
function nowWeekIdx(){ var i=weekIndexOf(todayD()); if(i>=0) return i; return todayD()<S.model.start ? 0 : S.model.weeks.length-1; }

/* ───────── 렌더: 뼈대 ───────── */
function renderShell(){
  var M=S.model;
  var app=$('#app');
  app.innerHTML =
    '<section class="panel tl" aria-label="마일스톤 타임라인"><div class="tl-head"><span>마일스톤</span><span class="muted" id="tlHint" style="font-weight:400;font-size:13px"></span></div>'+
      '<div class="tl-scroll" id="tlScroll"><div class="tl-track" id="tlTrack"></div></div><div class="tl-note" id="tlNote"></div></section>'+
    '<section class="panel filters" id="filters" aria-label="필터"></section>'+
    '<div class="tabs" role="tablist" aria-label="보기 전환">'+
      tabBtn('week','주간 보기')+tabBtn('cal','월간 캘린더')+tabBtn('list','리스트')+
    '</div>'+
    '<section class="view" id="view-week" role="tabpanel" aria-label="주간 보기"></section>'+
    '<section class="view" id="view-cal" role="tabpanel" aria-label="월간 캘린더"></section>'+
    '<section class="view" id="view-list" role="tabpanel" aria-label="리스트"></section>';
  app.querySelectorAll('.tab').forEach(function(b){ b.addEventListener('click', function(){ setView(b.dataset.v); }); });
  $('#title').textContent = M.title;
  document.title = 'AMLA 마케팅/PR 일정';
}
function tabBtn(v,label){ return '<button class="tab" role="tab" type="button" data-v="'+v+'" aria-selected="false">'+label+'</button>'; }

function setView(v){
  S.view=v;
  document.querySelectorAll('.tab').forEach(function(b){ b.setAttribute('aria-selected', b.dataset.v===v?'true':'false'); });
  ['week','cal','list'].forEach(function(k){ $('#view-'+k).classList.toggle('active', k===v); });
  if(v==='week') layoutWeek(true);
}

/* ───────── 헤더 · D-day ───────── */
function renderHeader(){
  var M=S.model, t=todayD();
  var y1=M.start.getFullYear(), y2=M.end.getFullYear();
  $('#period').textContent = y1 + '.' + (M.start.getMonth()+1) + (y1===y2 ? '–' + (M.end.getMonth()+1) : ' – ' + y2 + '.' + (M.end.getMonth()+1));
  $('#today').textContent = full(t);
  var next = M.milestones.filter(function(m){ return m.date>=t; })[0];
  var dd=$('#dday');
  if(next){
    var n=dayDiff(t,next.date);
    dd.hidden=false;
    dd.innerHTML = '다음 마일스톤 <b>'+esc(next.text)+'</b> <span class="muted">'+mdw(next.date)+'</span> <strong>'+(n===0?'D-DAY':'D-'+n)+'</strong>';
  } else dd.hidden=true;
}

/* ───────── 마일스톤 타임라인 ───────── */
function xOf(d){
  var M=S.model; var mi=-1;
  for(var i=0;i<M.months.length;i++){ if(M.months[i].y===d.getFullYear() && M.months[i].m===d.getMonth()){ mi=i; break; } }
  if(mi<0) return null;
  return (mi + (d.getDate()-0.5)/M.months[mi].days) / M.months.length;
}
function renderTimeline(){
  var M=S.model, t=todayD(), track=$('#tlTrack');
  var h='<div class="tl-lanes" id="tlAbove"></div><div class="tl-bar" id="tlBar">';
  M.months.forEach(function(m){ h+='<div class="tl-month"><span>'+(m.m+1)+'월</span></div>'; });
  h+='</div><div class="tl-lanes" id="tlBelow"></div>';
  track.innerHTML=h;
  var bar=$('#tlBar');
  M.milestones.forEach(function(ms,i){
    var x=xOf(ms.date); if(x==null) return;
    var pin=document.createElement('div'); pin.className='tl-pin'+(ms.tent?' tent':''); pin.style.left=(x*100)+'%'; bar.appendChild(pin);
    var lb=document.createElement('button'); lb.type='button';
    lb.className='tl-label'+(ms.tent?' tent':'')+(ms.date<t?' past':'');
    lb.dataset.x=x; lb.dataset.i=i;
    lb.innerHTML='<b>'+esc(ms.text)+'</b><span class="d">'+mdw(ms.date)+'</span>';
    lb.addEventListener('click', function(e){ openMilestone(ms, e.currentTarget); });
    track.appendChild(lb);
  });
  var tx=xOf(t);
  if(tx!=null){
    var tl=document.createElement('div'); tl.className='tl-today'; tl.style.left=(tx*100)+'%';
    bar.appendChild(tl);
    var tlb=document.createElement('div'); tlb.className='tl-label today'; tlb.dataset.x=tx; tlb.textContent='오늘 '+md(t);
    track.appendChild(tlb);
    $('#tlNote').textContent='';
  } else {
    var n=dayDiff(t,M.start);
    $('#tlNote').textContent = n>0 ? '일정 시작 '+mdw(M.start)+'까지 D-'+n : '전체 일정이 종료되었습니다.';
  }
  layoutTimeline();
}
function layoutTimeline(){
  var track=$('#tlTrack'); if(!track) return;
  var mob=isMobile();
  track.style.width = mob ? (S.model.months.length*100)+'%' : '100%';
  $('#tlHint').textContent = mob ? '← 좌우로 밀어 월 이동 →' : '';
  var inner = track.clientWidth - 32, gap=8;
  var labels=[].slice.call(track.querySelectorAll('.tl-label'));
  var lanes={above:[], below:[]}, laneH=0, placed=[];
  labels.sort(function(a,b){ return a.dataset.x-b.dataset.x; });
  labels.forEach(function(lb){
    lb.style.left='0px'; lb.style.top='0px';
    var w=lb.offsetWidth, h=lb.offsetHeight; laneH=Math.max(laneH,h);
    var xv=+lb.dataset.x, nM=S.model.months.length, seg=inner/nM, mi=Math.min(nM-1, Math.floor(xv*nM));
    var cx=16 + xv*inner;
    var lo=16+mi*seg, hi=16+(mi+1)*seg-w;
    var left = cx - w/2;
    if(hi>=lo) left=Math.max(lo, Math.min(hi, left));
    left=Math.max(0, Math.min(track.clientWidth - w, left));
    var order=[]; for(var k=0;k<6;k++){ order.push(['above',k]); order.push(['below',k]); }
    for(var o=0;o<order.length;o++){
      var side=order[o][0], ln=order[o][1], arr=lanes[side];
      if(arr[ln]==null || arr[ln] + gap <= left){ arr[ln]=left+w; placed.push({lb:lb, side:side, ln:ln, left:left, cx:cx, today:lb.classList.contains('today')}); break; }
    }
  });
  var laneStep=laneH+6, nAbove=lanes.above.length, nBelow=lanes.below.length;
  var above=$('#tlAbove'), below=$('#tlBelow'), bar=$('#tlBar');
  above.style.height=(nAbove*laneStep+6)+'px'; below.style.height=(nBelow*laneStep+6)+'px';
  track.querySelectorAll('.tl-stem').forEach(function(s){ s.remove(); });
  var barTop=above.offsetHeight, barMid=barTop+29;
  placed.forEach(function(p){
    var top = p.side==='above' ? (nAbove-1-p.ln)*laneStep : barTop+bar.offsetHeight+6+p.ln*laneStep;
    p.lb.style.left=p.left+'px'; p.lb.style.top=top+'px';
    var stem=document.createElement('div'); stem.className='tl-stem'+(p.today?' today':''); stem.style.left=p.cx+'px';
    if(p.side==='above'){ stem.style.top=(top+laneH)+'px'; stem.style.height=Math.max(0,barMid-(top+laneH))+'px'; }
    else { stem.style.top=barMid+'px'; stem.style.height=Math.max(0,top-barMid)+'px'; }

}
function scrollTimelineToToday(){

}

  $('#wkNext').addEventListener('click', function(){ goWeek(S.weekIdx+1, true); });
  var raf=0;
  sc.addEventListener('scroll', function(){ if(raf) return; raf=requestAnimationFrame(function(){ raf=0; var st=weekStep(); if(st) { S.weekIdx=Math.round(sc.scrollLeft/st); updateWeekNav(); } }); }, {passive:true});

function weekStep(){
  var sc=$('#wkScroll'); if(!sc) return 0;
  if(S.mobile) return sc.clientWidth;

}
function layoutWeek(restore){
  var sc=$('#wkScroll'); if(!sc || !sc.offsetParent) { return; }
  var W=S.model.weeks.length, w=sc.clientWidth;
  var g=$('#wkGrid');
  if(g){
    var lab, per;
    if(window.innerWidth>=1025){ lab=112; per=W; }
    else { lab=104; per = w>=760 ? 3 : 2; }
    var wcol=Math.floor((w-lab)/per);
    if(window.innerWidth>=1025) wcol=(w-lab)/W;
    g.style.setProperty('--lab', lab+'px'); g.style.setProperty('--wcol', wcol+'px');
    sc.style.setProperty('--lab', lab+'px');
  }
  if(S.weekIdx==null) S.weekIdx=nowWeekIdx();
  if(restore) goWeek(S.weekIdx, false);
  updateWeekNav();
}
function maxWeekIdx(){
  var W=S.model.weeks.length;

function goWeek(i, smooth){

function updateWeekNav(){

function renderList(){
  var M=S.model, box=$('#view-list'), evs=filtered(), t=todayD(), nowI=weekIndexOf(t);
  var groups=M.weeks.map(function(w){ return {w:w, items:[]}; });
  evs.forEach(function(e){ var i=weekIndexOf(e.date); if(i>=0) groups[i].items.push({type:'ev', e:e, d:e.date}); });

  groups.forEach(function(g){ g.items.sort(function(a,b){ return a.d-b.d || (a.type==='ms'?-1:1); }); });
  groups=groups.filter(function(g){ return g.items.length; });
  var past=groups.filter(function(g){ return g.w.end<t; }), rest=groups.filter(function(g){ return g.w.end>=t; });

  }

    g.items.forEach(function(it){
      var d=it.d, dcls='ag-date'+(isWeekend(d)?' we':'')+(d.getTime()===t.getTime()?' today':'');
      var dateH='<div class="'+dcls+'">'+md(d)+'<small>'+DOW[d.getDay()]+'요일</small></div>';
      if(it.type==='ms'){
        s+='<button type="button" class="ag-item ms" data-ms="'+it.i+'">'+dateH+'<div class="ag-body"><div class="tags"><span class="ms-flag'+(it.m.tent?' tent':'')+'" style="cursor:inherit">⚑ 마일스톤</span>'+(it.m.tent?'<span class="tent-b">가확정</span>':'')+'</div><div class="txt">'+esc(it.m.text)+'</div></div></button>';

/* ───────── 상세 팝오버 / 바텀시트 ───────── */
var lastFocus=null;
function bindCards(root){

}
function openEvent(id, anchor){
  var e=S.model.events.filter(function(x){ return x.id===id; })[0]; if(!e) return;

    '<h4 id="popTitle">'+esc(e.text.split('\n')[0])+'</h4>'+

function openMilestone(m, anchor){
  var n=dayDiff(todayD(), m.date);
  openPop('<h4 id="popTitle">⚑ '+esc(m.text)+'</h4><dl><dt>날짜</dt><dd>'+full(m.date)+' '+(m.tent?'<span class="tent-b">가확정</span>':'')+'</dd><dt>구분</dt><dd>전체 마일스톤</dd><dt>D-day</dt><dd>'+(n>0?'D-'+n:n===0?'D-DAY':'D+'+(-n))+'</dd></dl>', anchor);
}
function openDay(k, anchor){
  var list=filtered().filter(function(e){ return key(e.date)===k; });
  var ms=S.model.milestones.map(function(m,i){ return {m:m,i:i}; }).filter(function(o){ return key(o.m.date)===k; });
  var p=k.split('-'), d=new Date(+p[0], +p[1]-1, +p[2]);
  var h='<h4 id="popTitle">'+full(d)+'</h4><div class="items">';
  ms.forEach(function(o){ h+=msFlagHTML(o.m,o.i); });
  list.forEach(function(e){ h+=cardHTML(e).replace('class="card','class="card in-pop'); });
  if(!list.length && !ms.length) h+='<div class="muted">일정이 없습니다.</div>';
  h+='</div>';
  openPop(h, anchor);
  var pop=$('#pop');
  pop.querySelectorAll('.card .cat').forEach(function(c){ c.style.display='flex'; });
  bindCards(pop);
}
function openPop(inner, anchor){
  var pop=$('#pop'), scrim=$('#scrim');
  lastFocus=anchor||document.activeElement;
  pop.innerHTML='<div class="grab" aria-hidden="true"></div><button type="button" class="btn icon x" id="popX" aria-label="닫기">×</button>'+inner;
  pop.classList.add('show'); scrim.classList.add('show');
  if(!isMobile() && anchor){
    pop.style.left='0px'; pop.style.top='0px';
    var r=anchor.getBoundingClientRect(), pw=pop.offsetWidth, ph=pop.offsetHeight, vw=window.innerWidth, vh=window.innerHeight;
    var left=Math.min(Math.max(16, r.left), vw-pw-16);
    var top = (r.bottom+8+ph < vh-16) ? r.bottom+8 : Math.max(16, r.top-8-ph);
    pop.style.left=left+'px'; pop.style.top=top+'px';
  } else if(!isMobile()){
    pop.style.left=Math.max(16,(window.innerWidth-pop.offsetWidth)/2)+'px'; pop.style.top='20vh';
  }
  $('#popX').addEventListener('click', closePop);
  $('#popX').focus({preventScroll:true});
}
function closePop(){
  var pop=$('#pop'); if(!pop.classList.contains('show')) return;
  pop.classList.remove('show'); $('#scrim').classList.remove('show');
  if(lastFocus && lastFocus.focus && document.body.contains(lastFocus)) lastFocus.focus({preventScroll:true});
}
$('#scrim').addEventListener('click', closePop);
document.addEventListener('keydown', function(e){ if(e.key==='Escape') closePop(); });

  } else {
    var hint = (err && err.appsScript) || inAppsScript()
      ? 'Apps Script 편집기에서 Code.gs에 getSheetData 함수가 있는지 확인하고 저장한 뒤, [배포 → 배포 관리 → 수정 → 버전: 새 버전 → 배포]로 다시 배포해 주세요.'
      : '시트 공유 설정이 “링크가 있는 모든 사용자 – 뷰어”인지 확인한 뒤 새로고침해 주세요.';
    $('#app').innerHTML='<div class="err-box" role="alert"><h2>일정을 불러오지 못했습니다</h2><p>'+msg+'</p><p>'+hint+'</p><p>'+link+'</p></div>';
  }
}
function sync(){
  if(S.loading) return;
  S.loading=true; _lastSync=Date.now();
  var ico=$('#refreshIco'); ico.classList.add('spin'); $('#refreshBtn').disabled=true;
  setSync(S.model?'동기화 중…':'불러오는 중…');
  loadRows().then(function(rows){
    S.model = buildModel(rows);
    $('#banner').classList.remove('show');
    renderAll();
    var n=new Date();
    setSync('마지막 동기화 '+pad(n.getHours())+':'+pad(n.getMinutes())+':'+pad(n.getSeconds()));
  }).catch(function(err){
    console.error(err);
    showError(err);
    setSync('동기화 실패');
  }).then(function(){
    S.loading=false; ico.classList.remove('spin'); $('#refreshBtn').disabled=false;
  });
}
$('#refreshBtn').addEventListener('click', sync);
setInterval(sync, REFRESH_MS);
document.addEventListener('visibilitychange', function(){ if(!document.hidden && S.model && Date.now()-_lastSync>REFRESH_MS) sync(); });

/* ───────── 리사이즈 ───────── */
var rt=0;
window.addEventListener('resize', function(){
  clearTimeout(rt);
  rt=setTimeout(function(){
    if(!S.model) return;
    var mob=isMobile();
    if(mob!==S.mobile){ var keep=S.weekIdx; renderWeek(); renderCal(); S.weekIdx=keep; layoutWeek(true); }
    else layoutWeek(true);
    layoutTimeline();
  }, 120);
});
window.addEventListener('beforeprint', function(){ if(S.model){ var k=S.pastOpen; S.pastOpen=true; renderList(); S.pastOpen=k; } });
window.addEventListener('afterprint', function(){ if(S.model) renderList(); });

$('#today').textContent = full(todayD());
sync();
})();
</script>
</body>
</html>
